name: Android APK

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    # Self-hosted runner: the runner image ships no Android SDK, so the
    # setup-android step below provisions cmdline-tools and accepts licenses
    # (AGP then auto-downloads the platform/build-tools it needs).
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android fails on the deprecated "tools" package
      # with newer cmdline-tools, so provision the SDK by hand.
      - name: Install Android SDK cmdline-tools
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          sudo mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
          sudo unzip -q /tmp/ct.zip -d /tmp/ct
          sudo mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - run: npm ci

      # AdMob ships only when the repo variable ENABLE_ADMOB is set to 'true'
      # (Settings -> Secrets and variables -> Actions -> Variables). Default:
      # ads are stripped from the final app - no SDK, no manifest entry, no ad code.
      - name: Strip AdMob (ENABLE_ADMOB is not true)
        if: ${{ vars.ENABLE_ADMOB != 'true' }}
        run: |
          npm rm @capacitor-community/admob
          node scripts/strip-admob.mjs

      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: greader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Signed release AAB (for Play) and signed release APK (direct install).
      # No-ops until the repo secrets exist:
      # KEYSTORE_BASE64 (base64 of the .keystore), KEYSTORE_PASSWORD,
      # KEY_PASSWORD and optionally KEY_ALIAS (defaults to greader).
      - name: Build signed release AAB + APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured - skipping the release AAB."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > app/greader-news.keystore
          export KEYSTORE_FILE="$PWD/app/greader-news.keystore"
          export KEY_ALIAS="${KEY_ALIAS:-greader}"
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: greader-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        with:
          name: greader-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
